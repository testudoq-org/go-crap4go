version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: crap
    main: ./cmd/crap
    binary: crap
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Windows arm64 is uncommon; skip it to reduce asset noise
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: crap
    builds: [crap]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: testudoq-org
    name: go-crap4go
  draft: false
  prerelease: auto   # tags like v1.0.0-rc.1 are marked pre-release automatically
  name_template: "{{ .Tag }}"
